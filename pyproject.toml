[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project]
name = "pes-music"
version = "2.0.0"
description = "Put your own songs in the PES 2016-2021 menus on PC."
requires-python = ">=3.12"
license = "MIT"
dependencies = ["customtkinter==6.0.0"]

[project.optional-dependencies]
build = ["pyinstaller==6.22.3"]
dev = ["ruff"]

[tool.ruff]
line-length = 125
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B023"]
